name: Update IPTV Sources

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）自动更新
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "sources.json"
      - "scripts/aggregate.py"
      - ".github/workflows/update-iptv.yml"

permissions:
  contents: write

concurrency:
  group: update-iptv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Aggregate playlists
        run: python scripts/aggregate.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.m3u international.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update IPTV playlists ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi